# Specify docker version
version : "3"

# to define any service, basically any container we want to run
services: 
  # Web app in Python
  web:
    # Trigger builded image "Dockerfile"
    build: .
    # Define the ports we want to bind
    ports:
      - 8000:8000
    # Use specific volumes, left host path and right the container path
    volumes:
      # . means here, so in this case this folder get replicated on the container
      - .:/app
      - application-logs:/app/logs
    # Use specific network
    networks:
      - my-network
    # Create environment variable
    environment:
      - REDIS_HOST=redis-db
    # waits for redis-db to be up and running
    depends_on:
      - redis-db
  # Create a new Service
  redis-db:
    # Here in this case we use image instead of build since we take a existing build from Docker library
    image: "redis:7-alpine"
    volumes:
      - redis-data:/data
    networks:
      - my-network
    
# Define networks
networks :
  my-network:
    # Type of network
    driver: bridge

# define volumes
volumes:
  application-logs: 
  redis-data: 